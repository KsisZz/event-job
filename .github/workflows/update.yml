name: Free hourly event jobs and AI review
on:
  schedule:
    - cron: '37 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['updater/**', 'ui/**', 'build.mjs', '.github/workflows/update.yml']
permissions:
  contents: write
concurrency:
  group: event-job-hourly
  cancel-in-progress: false
jobs:
  update:
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm test
      - run: node updater/update.mjs
      - name: Check whether AI has submissions to review
        id: queue
        env:
          MODERATION_KEY: ${{ secrets.EVENT_MODERATION_KEY }}
        run: node updater/check-queue.mjs
      - name: Start free local model on the public runner
        if: steps.queue.outputs.pending == 'true'
        run: |
          curl --fail --show-error --silent --location https://ollama.com/install.sh | sh
          ollama serve > /tmp/ollama-event.log 2>&1 &
          for i in $(seq 1 20); do
            if curl --fail --silent http://127.0.0.1:11434/api/tags >/dev/null; then break; fi
            sleep 2
          done
          ollama pull qwen2.5:1.5b
      - name: Review pending advertisements
        if: steps.queue.outputs.pending == 'true'
        env:
          MODERATION_KEY: ${{ secrets.EVENT_MODERATION_KEY }}
        run: node updater/moderate.mjs
      - run: npm run build
      - name: Publish updated public job data
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add snapshot.json index.html app.js style.css sitemap.xml robots.txt .nojekyll
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh public event vacancies'
            git push
          fi
